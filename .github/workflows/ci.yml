name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff mypy
      - run: ruff check src tests examples
      - name: Type check (strict, as shipped with py.typed)
        run: mypy
      - name: Type check examples as a downstream user would
        run: MYPYPATH=src mypy --strict examples

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt
      - name: Build docs (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The real-server tests drive OpenSSH's sftp-server binary directly
      # (macOS ships it at /usr/libexec/sftp-server).
      - name: Install sftp-server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-sftp-server
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest -q -rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
