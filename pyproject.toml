[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mfatsftp"
version = "0.3.1"
description = "Pure-Python SFTP client that speaks through your system OpenSSH (no crypto to maintain)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehdi" }]
keywords = ["sftp", "ssh", "openssh", "file-transfer", "paramiko-alternative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []  # stdlib only — the only external requirement is the `ssh` binary

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "mypy"]
docs = ["sphinx>=7.2", "furo>=2024.8.6", "myst-parser>=3.0"]

[project.urls]
Homepage = "https://github.com/mfat/mfatsftp"
Source = "https://github.com/mfat/mfatsftp"
Issues = "https://github.com/mfat/mfatsftp/issues"
Changelog = "https://github.com/mfat/mfatsftp/blob/main/CHANGELOG.md"

# Core metadata 2.4 (license expressions); twine and older tooling reject 2.5.
[tool.hatch.build.targets.wheel]
packages = ["src/mfatsftp"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md",
    "SECURITY.md", "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
strict = true
files = ["src/mfatsftp"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
